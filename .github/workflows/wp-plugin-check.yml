name: WP Plugin Check
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Read directories from file and format
        id: format_dirs
        run: |
          # Read the file, remove lines starting with '#', remove empty lines, remove leading slashes, and replace newlines with commas
          dirs=$(grep -v '^#' directories.txt | sed '/^$/d' | sed 's|^/||' | tr -s '\n' ',' | sed 's/,$//')
          echo "::set-output name=formatted_dirs::$dirs"

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: ${{ env.formatted_dirs }}
