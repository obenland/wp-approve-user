name: WP Plugin Check
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Read directories from file and format
        id: format_dirs
        # Read the file, remove lines starting with '#', remove empty lines, remove leading slashes, and replace newlines with commas
        run: |
          # Output the file contents for debugging
          echo "Contents of .distignore:"
          cat .distignore

          # Read the file, remove lines starting with '#', remove empty lines, remove leading slashes, and replace newlines with commas
          dirs=$(grep -v '^#' .distignore | sed '/^$/d' | sed 's|^/||' | tr -s '\n' ',' | sed 's/,$//')

          # Output the formatted directories for debugging
          echo "Formatted directories: $dirs"

          # Save the formatted directories to an environment file for use in subsequent steps
          echo "formatted_dirs=$dirs" >> $GITHUB_ENV

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: ${{ env.formatted_dirs }}
