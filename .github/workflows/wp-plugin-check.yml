name: WP Plugin Check
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - trunk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Read directories from file and format
        id: format_dirs
        run: |
          # Read the file and replace newlines with commas
          dirs=$(cat .distignore | tr '\n' ',')
          # Remove the trailing comma if there is one
          dirs=${dirs%,}
          echo "formatted_dirs=$dirs" >> $GITHUB_ENV

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: ${{ env.formatted_dirs }}
