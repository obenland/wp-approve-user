name: PHPCS check
on:
  push

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHPCS check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.2"
          ini-values: "memory_limit=1G"
          coverage: none
          tools: cs2pr

      - name: Install Composer dependencies
        uses: "ramsey/composer-install@v3"

      - name: Run PHPCS checks
        continue-on-error: true
        run: |
            # Run PHPCS and display results in the log
            vendor/bin/phpcs --standard=WordPress --extensions=php --ignore="node_modules,vendor" --warning-severity=1 .

      - name: Generate report for PR
        continue-on-error: true
        run: |
          # Run PHPCS to create a checkstyle report for PR annotations
          vendor/bin/phpcs --report-checkstyle=./phpcs-report.xml --standard=WordPress --extensions=php --ignore="node_modules,vendor" --warning-severity=1 .

      - name: Show PHPCS results in PR
        if: always()  # Run this step even if previous steps fail
        run: cs2pr ./phpcs-report.xml
