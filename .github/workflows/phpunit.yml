name: PHPUnit

on: [push]

jobs:
  run:
    name: PHP ${{ matrix.php-version }}, WP ${{ matrix.wp-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2']
        wp-version: ['latest', '5.7', '5.6', '5.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, intl, curl, dom, xml, json, gd, mysql, mysqli
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-suggest

      - name: Setup WordPress testing environment
        run: |
          curl -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          wp core download --path=/tmp/wordpress --version=${{ matrix.wp-version }}
          cp wp-tests-config.php /tmp/wordpress/wp-tests-config.php
          wp core install --url="http://localhost" --title="Test" --admin_user="admin" --admin_password="password" --admin_email="admin@example.com" --skip-email --path=/tmp/wordpress
          wp plugin activate --all --path=/tmp/wordpress

      - name: Install WordPress tests
        run: |
          bash bin/install-wp-tests.sh wordpress_test root '' localhost ${{ matrix.wp-version }}

      - name: Run PHPUnit tests
        run: |
          ./vendor/bin/phpunit
