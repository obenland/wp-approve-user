name: PHPUnit

on: [push]

jobs:
  run:
    name: PHP ${{ matrix.php-versions }}, WP ${{ matrix.wp-versions }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions:
          ["7.4", "8.1", "8.2", "8.3"]
        wp-versions:
          ["latest", "4.7"]

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup MySQL 8.0 with mysql_native_password
        uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "8.0"
          my-cnf: |
            bind_address=127.0.0.1
            default-authentication-plugin=mysql_native_password
          root-password: root

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          extensions: mysql, mysqli
          tools: composer

      - name: Modify Composer for WP 4.7
        if: matrix.wp-versions == '4.7'
        run: |
          composer require --dev phpunit/phpunit:5.7 yoast/phpunit-polyfills:0.2 --ignore-platform-reqs --no-update

      - name: Modify Composer for other WP versions
        if: matrix.wp-versions != '4.7'
        run: |
          composer require --dev phpunit/phpunit:^9.5 yoast/phpunit-polyfills:^1.0 --ignore-platform-reqs --no-update

      - name: Install Composer dependencies
        run: composer install --optimize-autoloader --prefer-dist --ignore-platform-reqs

      - name: Install WP Tests
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp-versions }}

      - name: PHPUnit tests
        run: |
          echo "define('WP_TESTS_PHPUNIT_POLYFILLS_PATH', '$HOME/.composer/vendor/yoast/phpunit-polyfills');" >> /tmp/wordpress-tests-lib/wp-tests-config.php
          phpunit --config=phpunit.xml
          WP_MULTISITE=1 phpunit --config=phpunit.xml
