name: PHPUnit

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['7.4', '8.1', '8.2', '8.3']
        wordpress-versions: ['latest', '4.7']

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl, mysqli
          coverage: xdebug

      - name: Start MySQL Service
        run: |
          sudo systemctl start mysql.service
          sudo systemctl status mysql.service

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          if [ "${{ matrix.wordpress-versions }}" = "4.7" ] && [ "${{ matrix.php-versions }}" = "7.4" ]; then
            composer require --dev phpunit/phpunit:^7.5 --no-update
          elif [ "${{ matrix.wordpress-versions }}" = "4.7" ] && [[ "${{ matrix.php-versions }}" =~ ^8\. ]]; then
            composer require --dev phpunit/phpunit:^8.5 --no-update
          else
            composer require --dev phpunit/phpunit:^9.0 --no-update
          fi
          composer install --prefer-dist --no-progress

      - name: Install WordPress test suite
        env:
          WP_VERSION: ${{ matrix.wordpress-versions }}
        run: |
          bash bin/install-wp-tests.sh wordpress_test root rootpassword 127.0.0.1:${{ job.services.mysql.ports['3306'] }} $WP_VERSION

      - name: Run PHPUnit tests
        run: |
          vendor/bin/phpunit
          WP_MULTISITE=1 vendor/bin/phpunit
