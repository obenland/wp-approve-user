name: PHPUnit

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['7.4', '8.1', '8.2', '8.3']
        wordpress-versions: ['latest', '4.7']

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, intl
          coverage: xdebug

      - name: Setup WordPress
        run: |
          wget https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          wp core download --version=${{ matrix.wordpress-versions }} --path=/tmp/wordpress

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Start MySQL Service
        run: sudo systemctl start mysql.service

      - name: Verify MySQL connection
        run: |
          sudo apt-get install -y mysql-client
          mysql --host=127.0.0.1 --port=3306 -uroot -proot -e "SHOW DATABASES;"

      - name: Install WordPress test suite
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wordpress-versions }}
        continue-on-error: true

      - name: Run PHPUnit tests
        run: |
          vendor/bin/phpunit
          WP_MULTISITE=1 vendor/bin/phpunit
