name: PHPUnit Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  php-coverage:
    name: "PHP Coverage Analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_ENV_PHP_VERSION: '8.2'
      WP_ENV_CORE: 'https://wordpress.org/wordpress-latest.zip'

    steps:
      - uses: styfle/cancel-workflow-action@0.11.0

      - uses: actions/checkout@v3

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Composer update
        run: composer update

      - name: npm install
        run: npm ci

      - name: Install WordPress with Xdebug enabled
        run: npm run wp-env start -- --xdebug=coverage

      - name: Generate code coverage report
        run: npm run test-php-coverage

      - name: Copy coverage file from container
        run: |
          CONTAINER_ID=$(npm run wp-env run tests-cli -- --env-cwd=/var/www/html/wp-content/plugins/wp-approve-user sh -c 'hostname' | tail -n 1)
          docker cp ${CONTAINER_ID}:/var/www/html/wp-content/plugins/wp-approve-user/coverage.xml ./coverage.xml

      - name: Generate coverage summary
        id: coverage-summary
        run: |
          TOTAL_ELEMENTS=$(xmllint --xpath "string(//metrics/@elements)" coverage.xml)
          COVERED_ELEMENTS=$(xmllint --xpath "string(//metrics/@coveredelements)" coverage.xml)
          COVERAGE=$(echo "scale=2; ($COVERED_ELEMENTS / $TOTAL_ELEMENTS) * 100" | bc)
          echo "coverage=$COVERAGE%" >> $GITHUB_OUTPUT

      - name: Find Comment
        uses: peter-evans/find-comment@v2
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: PHPUnit Coverage Report

      - name: Create or Update Comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## PHPUnit Coverage Report
            
            Total Coverage: ${{ steps.coverage-summary.outputs.coverage }}
            
            <details>
            <summary>View Details</summary>
            
            ```xml
            $(cat coverage.xml)
            ```
            
            </details>
          edit-mode: replace
