name: E2E Tests

on:
    push:
        branches: [trunk]
        paths-ignore:
            - '**/*.md'
            - 'README.md'
            - 'lang/**'
            - '.wordpress-org/**'
            - '.distignore'
            - '.editorconfig'
            - '.gitignore'
    pull_request:
        branches: [trunk]
        paths-ignore:
            - '**/*.md'
            - 'README.md'
            - 'lang/**'
            - '.wordpress-org/**'
            - '.distignore'
            - '.editorconfig'
            - '.gitignore'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    playwright:
        name: Playwright
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Playwright system deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: Start WordPress environment
              run: npm run start

            - name: Run Playwright tests
              run: npm run test:e2e

            - name: Upload Playwright report
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7

    playwright-multisite:
        name: Playwright (Multisite)
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: playwright-cache
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium

            - name: Install Playwright system deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: Start multisite WordPress environment
              run: npm run start:multisite

            - name: Run Playwright multisite tests
              run: npm run test:e2e:multisite

            - name: Upload Playwright multisite report
              if: ${{ always() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report-multisite
                  path: playwright-report/
                  retention-days: 7
