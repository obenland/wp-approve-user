version: 2
updates:
    # Enable version updates for Composer
    - package-ecosystem: 'composer'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      reviewers:
          - 'obenland'
      labels:
          - 'dependencies'
          - 'composer'

    # Enable version updates for npm
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      reviewers:
          - 'obenland'
      labels:
          - 'dependencies'
          - 'npm'

    # Enable version updates for GitHub Actions
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 5
      reviewers:
          - 'obenland'
      labels:
          - 'dependencies'
          - 'github-actions'
